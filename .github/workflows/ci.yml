name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # Emitting permissions builds shell-unwrap's hook from its vendored Go
      # source, and the tests run it.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/coding_agents_sync/targets/shell-unwrap/go.mod
          cache: false
      - run: uv sync --locked
      - run: uv run --locked coding-agents-check
      - run: uv build
