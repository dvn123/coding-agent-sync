[project]
name = "coding-agents-sync"
version = "0.1.0"
description = "Deterministic compiler for portable coding-agent configuration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.14.2",
  "PyYAML>=6.0.2",
  "tomlkit>=0.15.2",
  "typer>=0.27.3",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "inline-snapshot>=0.36.1",
  "pytest>=9.2.0",
  "pytest-httpserver>=1.2.0",
  "ruff>=0.17.3",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
coding-agents-check = "coding_agents_sync.cli:check"
coding-agents-sync = "coding_agents_sync.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
exclude-newer = "3 days"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agents_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "capability_case(id): installed coding-agent capability covered by a live test",
  "capability_desktop: launches the Cursor Desktop GUI when explicitly enabled",
  "capability_live: launches installed coding agents through isolated local services",
]

[tool.ruff]
line-length = 88
target-version = "py314"
include = ["src/coding_agents_sync/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src/coding_agents_sync", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
