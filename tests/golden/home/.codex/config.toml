default_permissions = "coding-agents"

[permissions.coding-agents]
description = "Neutral fixture permission policy."
extends = ":workspace"

[permissions.coding-agents.filesystem]
"<tmp>/home/fixture-shared" = "write"
"/**/.env" = "deny"

[shell_environment_policy]
exclude = ["FIXTURE_TOKEN"]

[mcp_servers.fixture-local]
command = "fixture-mcp"
args = ["--stdio"]
disabled_tools = ["erase"]

[mcp_servers.fixture-local.env]
FIXTURE_MODE = "neutral"

[mcp_servers.fixture-local.tools.inspect]
approval_mode = "approve"

[mcp_servers.fixture-local.tools.submit]
approval_mode = "prompt"

[mcp_servers.fixture-optional]
url = "https://optional.example.test/mcp"
enabled = false

[mcp_servers.fixture-optional.tools.lookup]
approval_mode = "approve"

[mcp_servers.fixture-remote]
url = "https://mcp.example.test/mcp"

[fixture]
codex = true
