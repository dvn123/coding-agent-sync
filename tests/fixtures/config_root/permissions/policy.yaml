description: Neutral fixture permission policy.
wrappers:
  - env
tools:
  read: allow
  edit: ask
  write: deny
  webfetch: allow
  websearch: ask
workspace:
  allow:
    - ~/fixture-shared
  ask:
    - /tmp/fixture-review
secret_paths:
  - "**/.env"
secret_names:
  - FIXTURE_TOKEN
targets:
  codex:
    omit:
      - tools
      - workspace.ask
  cursor:
    omit:
      - tools
      - workspace
      - secret_names
  pi:
    omit:
      - tools
