schema: coding-agents/v4
kind: permission-rules
id: fixture-commands
name: Fixture commands
description: Neutral fixture command permissions.
options:
  fixture-tool:
    - -C
allow:
  - [fixture-tool, status]
ask:
  - command: fixture-tool
    subcommand: publish
    tail:
      - --public
deny:
  - command: fixture-tool
    subcommand: remove
    exact: true
targets:
  codex:
    omit:
      commands.allow: Codex allow rules would skip its sandbox approval.
      commands.ask: Codex prompts by sandbox, not by rule.
  cursor:
    omit:
      commands.deny: Cursor Desktop has no deny channel; the CLI projects it.
