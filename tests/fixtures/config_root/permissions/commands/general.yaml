schema: coding-agents/v4
kind: permission-rules
id: fixture-commands
name: Fixture commands
description: Neutral fixture command permissions.
options:
  fixture-tool:
    - -C
allow:
  - [fixture-tool, status]
ask:
  - command: fixture-tool
    subcommand: publish
    tail:
      - --public
deny:
  - command: fixture-tool
    subcommand: remove
    exact: true
targets:
  codex:
    omit:
      commands: Codex exec policy cannot represent portable command predicates.
  cursor:
    omit:
      commands: Cursor Desktop has no ask or deny command channel.
